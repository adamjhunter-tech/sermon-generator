name: Generate new sermons

on:
  schedule:
    - cron: "0 14 * * 1"   # Monday 14:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of new episodes to process (default 4)"
        required: false
        default: "4"
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sermon-generator (script)
        uses: actions/checkout@v4
        with:
          path: generator

      - name: Checkout sermon-library (data destination)
        uses: actions/checkout@v4
        with:
          repository: adamjhunter-tech/sermon-library
          path: sermon-library
          token: ${{ secrets.SERMON_LIBRARY_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install yt-dlp groq
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Run generator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATA_DIR: sermon-library/data
          LIMIT: ${{ github.event.inputs.limit || '4' }}
        run: python generator/generate_sermons.py --limit "$LIMIT"

      - name: Fill missing dates from RSS
        run: |
          python3 - << 'EOF'
          import json, urllib.request
          from pathlib import Path
          from datetime import datetime
          from xml.etree import ElementTree as ET

          def parse_episodes(rss_bytes):
              root = ET.fromstring(rss_bytes)
              eps = []
              for item in root.findall(".//item"):
                  title = item.findtext("title") or ""
                  pub = item.findtext("pubDate") or ""
                  link = item.findtext("link") or ""
                  try:
                      dt = datetime.strptime(pub[:16], "%a, %d %b %Y")
                      date = dt.strftime("%Y-%m-%d")
                  except:
                      date = None
                  eps.append({"title": title, "date": date, "link": link})
              return eps

          print("Fetching RSS...")
          rss = urllib.request.urlopen("https://feeds.soundcloud.com/users/soundcloud:users:944857777/sounds.rss", timeout=30).read()
          episodes = parse_episodes(rss)
          ep_by_slug = {}
          for e in episodes:
              if e["link"] and e["date"]:
                  slug = e["link"].rstrip("/").split("/")[-1]
                  ep_by_slug[slug] = e
          print(f"Episodes indexed: {len(ep_by_slug)}")

          updated = 0
          for p in Path("sermon-library/data").glob("*.json"):
              try:
                  l = json.loads(p.read_text())
              except:
                  continue
              if l.get("date") and l["date"] not in ("Unknown", None, ""):
                  continue
              sc = l.get("soundcloud_url") or ""
              if not sc:
                  continue
              slug = sc.rstrip("/").split("/")[-1]
              if slug in ep_by_slug:
                  l["date"] = ep_by_slug[slug]["date"]
                  p.write_text(json.dumps(l, indent=2, ensure_ascii=False) + "\n")
                  updated += 1
          print(f"Filled dates for {updated} lessons")
          EOF

      - name: Rebuild data.js
        run: |
          python3 - << 'EOF'
          import json
          from pathlib import Path
          from datetime import datetime
          lessons = []
          for p in sorted(Path("sermon-library/data").glob("*.json")):
              try:
                  l = json.loads(p.read_text())
                  l.pop("transcript", None)
                  lessons.append(l)
              except Exception:
                  pass
          lessons.sort(key=lambda l: l.get("date") or "0000-00-00", reverse=True)
          out = {"generated": datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S"), "count": len(lessons), "lessons": lessons}
          Path("sermon-library/js/data.js").write_text("// Auto-generated from data/*.json\nwindow.LIBRARY_DATA = " + json.dumps(out, ensure_ascii=False) + ";\n")
          print(f"Rebuilt data.js with {len(lessons)} lessons")
          EOF

      - name: Commit and push to sermon-library
        working-directory: sermon-library
        run: |
          git config user.name "sermon-bot"
          git config user.email "bot@example.com"
          git add data/ js/data.js
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add new sermon transcripts [skip ci]"
            git push
          fi

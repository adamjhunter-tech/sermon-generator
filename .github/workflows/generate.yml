name: Generate new sermons

on:
  schedule:
    - cron: "0 14 * * 1"   # Monday 14:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of new episodes to process (default 4)"
        required: false
        default: "4"
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sermon-generator (script)
        uses: actions/checkout@v4
        with:
          path: generator

      - name: Checkout sermon-library (data destination)
        uses: actions/checkout@v4
        with:
          repository: adamjhunter-tech/sermon-library
          path: sermon-library
          token: ${{ secrets.SERMON_LIBRARY_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install yt-dlp groq
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Run generator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATA_DIR: sermon-library/data
          LIMIT: ${{ github.event.inputs.limit || '4' }}
        run: python generator/generate_sermons.py --limit "$LIMIT"

      - name: Rebuild data.js
        run: |
          python3 - << 'EOF'
          import json
          from pathlib import Path
          from datetime import datetime
          lessons = []
          for p in sorted(Path("sermon-library/data").glob("*.json")):
              try:
                  l = json.loads(p.read_text())
              l.pop("transcript", None)
              lessons.append(l)
              except Exception:
                  pass
          lessons.sort(key=lambda l: l.get("date") or "0000-00-00", reverse=True)
          out = {"generated": datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S"), "count": len(lessons), "lessons": lessons}
          Path("sermon-library/js/data.js").write_text("// Auto-generated from data/*.json\nwindow.LIBRARY_DATA = " + json.dumps(out, ensure_ascii=False) + ";\n")
          print(f"Rebuilt data.js with {len(lessons)} lessons")
          EOF

      - name: Commit and push to sermon-library
        working-directory: sermon-library
        run: |
          git config user.name "sermon-bot"
          git config user.email "bot@example.com"
          git add data/ js/data.js
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add new sermon transcripts [skip ci]"
            git push
          fi
